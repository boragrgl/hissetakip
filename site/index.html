<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisse Takip</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hisse Takip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
/* Ana sayfa: solda altın fiyatları kartı, sağda en iyi hisseler kartı (eşit boy) */
.ikili{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:24px;align-items:stretch}
.pano{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px 14px;display:flex;flex-direction:column}
.pano-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.pano-h h2{font-size:22px}
.pano-h h2 a{color:inherit;text-decoration:none}
.pano-h h2 a:hover{color:var(--blue)}
.pano-h .sag{font-size:13px;color:var(--soft);white-space:nowrap;display:flex;gap:12px;align-items:baseline}
.pano-h .sag a{font-size:14px;text-decoration:none}
.liste{display:grid;grid-template-columns:minmax(0,1fr) auto auto 5.4em;grid-template-rows:auto;grid-auto-rows:1fr;flex:1}
.liste .bas>*+*,.liste .sat>*+*{padding-left:18px}
.liste .bas,.liste .sat{display:contents}
.liste .bas span{font-size:13px;color:var(--soft);padding-block:6px;border-bottom:1px solid var(--line)}
.liste .sat>*{padding-block:13px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center}
.liste .sat:last-child>*{border-bottom:0}
.liste .r{justify-content:flex-end;text-align:right}
.liste a.sat{color:inherit;text-decoration:none}
.liste a.sat:hover>*{background:var(--card2)}
.liste .ad{font-size:17px;font-weight:500}
.liste .ad small{font-size:12px;font-weight:600;color:var(--soft);margin-right:6px}
.liste .al{color:var(--soft);font-size:16px}
.liste .st{font-weight:600;font-size:17px}
.pct{font-size:14px;font-weight:500}
.hl{grid-template-columns:minmax(0,1fr) auto 6em}
.hl .ad{flex-direction:column;align-items:flex-start!important;justify-content:center}
.hl .ad span{display:block;font-size:12px;color:var(--soft);font-weight:400;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.alt-not{font-size:13px;color:var(--soft);margin:auto 0 0;padding-top:12px}
@media(max-width:860px){.ikili{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){.liste .ad small{display:none}.pano{padding:16px 16px 10px;border-radius:18px}.liste{grid-template-columns:minmax(0,1fr) auto auto 4.6em}.liste .bas>*+*,.liste .sat>*+*{padding-left:10px}.hl{grid-template-columns:minmax(0,1fr) auto 5em}.liste .ad,.liste .st{font-size:16px}.liste .al{font-size:15px}.liste .sat>*{padding-block:12px}}
@media(max-width:380px){.liste:not(.hl){grid-template-columns:minmax(0,1fr) auto 4.6em}.liste:not(.hl) .al,.liste:not(.hl) .bas span:nth-child(2){display:none!important}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="./">Hisse Takip</a>
  <nav class="seg" aria-label="Bölümler"><a href="./" aria-current="page">Ana sayfa</a><a href="altin.html">Altın</a><a href="hisseler.html">Hisse Senetleri</a></nav>
</div></header>

<main class="wrap page">
  <p class="eyebrow" id="tarih"></p>
  <h1>Piyasa özeti</h1>

  <div class="ikili">
    <section class="pano" aria-labelledby="altin-h">
      <div class="pano-h"><h2 id="altin-h"><a href="altin.html">Altın fiyatları</a></h2><span class="sag" id="altin-zaman"></span></div>
      <div class="liste" id="altin-liste"></div>
      <p class="alt-not">Altınkaynak · gösterge fiyattır, işlem fiyatı değildir.</p>
    </section>

    <section class="pano" aria-labelledby="hisse-h">
      <div class="pano-h"><h2 id="hisse-h"><a href="hisseler.html">Hisse senetleri</a></h2><span class="sag"><span id="h-zaman"></span><a href="hisseler.html">Tümü</a></span></div>
      <div class="liste hl" id="hisse-liste"></div>
      <p class="alt-not" id="h-ozet"></p>
    </section>
  </div>
</main>

<footer><div class="wrap"><div>Altın: Altınkaynak. Hisseler: İş Yatırım mali tablolar ve oranlar. Kuralların mekanik uygulamasıdır; yatırım tavsiyesi değildir.</div></div></footer>

<script src="ortak.js"></script>
<script>
{
const { pc, esc, TURLER, para, son, degisim, altinYukle, zaman, degisimHtml } = HT;
const bas = (...b) => `<div class="bas">${b.map((t, i) => `<span${i ? ' class="r" style="display:flex;justify-content:flex-end"' : ""}>${t}</span>`).join("")}</div>`;
document.getElementById("tarih").textContent = new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
const ciz = () => {
  document.getElementById("altin-liste").innerHTML = bas("İsim", "Alış", "Satış", "%") + TURLER.map(([k, ad]) => {
    const p = son(k);
    return `<a class="sat" href="altin.html#${k}"><span class="ad">${k === "XAUUSD" ? "<small>XAU</small>" : ""}${ad}</span><span class="r al">${p ? para(k, p.a) : "—"}</span><span class="r st">${p ? para(k, p.s) : "—"}</span><span class="r">${degisimHtml(degisim(k))}</span></a>`;
  }).join("");
  document.getElementById("altin-zaman").textContent = zaman();
};
altinYukle(ciz);

// En iyi 5 hisse: önce karar sırası (alım adayı → koşullu → izleme → uzak dur), sonra potansiyel
const SIRA = { "ALIM ADAYI": 0, "KOŞULLU": 1, "İZLEME (BSA FIRSATI)": 2, "UZAK DUR": 3, "VERİ YOK": 4 };
const KAT = { "ALIM ADAYI": ["b-al", "Alım adayı"], "KOŞULLU": ["b-ko", "Koşullu"], "İZLEME (BSA FIRSATI)": ["b-iz", "İzleme"], "UZAK DUR": ["b-uz", "Uzak dur"], "VERİ YOK": ["b-yok", "Veri yok"] };
fetch("data/sonuc.json", { cache: "no-store" }).then(r => r.json()).then(D => {
  const S = D.sonuclar, n = k => S.filter(r => r.karar === k).length, d = new Date(D.meta.asOf);
  const en = [...S].sort((a, b) => (SIRA[a.karar] ?? 9) - (SIRA[b.karar] ?? 9) || (b.potansiyel ?? -9) - (a.potansiyel ?? -9)).slice(0, 5);
  document.getElementById("hisse-liste").innerHTML = bas("Hisse", "Karar", "Potansiyel") + en.map(r => {
    const k = KAT[r.karar] || ["b-yok", r.karar], p = r.potansiyel;
    return `<a class="sat" href="hisseler.html#${encodeURIComponent(r.kod)}"><span class="ad">${esc(r.kod)}<span>${esc(r.ad || r.sektor || "")}</span></span><span class="r"><span class="badge ${k[0]}">${k[1]}</span></span><span class="r"><span class="pct ${p == null ? "" : p >= 0 ? "up" : "down"}">${pc(p)}</span></span></a>`;
  }).join("");
  document.getElementById("h-zaman").textContent = d.toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
  document.getElementById("h-ozet").textContent = `${S.length} hisseden ${n("ALIM ADAYI")} tanesi dört maddeyi de geçiyor · ${n("KOŞULLU")} koşullu · ${n("İZLEME (BSA FIRSATI)")} izlemede`;
}).catch(() => { document.getElementById("h-ozet").textContent = "Hisse verisi okunamadı."; });
}
</script>
</body>
</html>
