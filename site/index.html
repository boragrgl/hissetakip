<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hisse Takip</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hisse Takip">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
/* Ana sayfa: üstte altın KPI'ları, altta hisse senetleri özeti. Sade. */
.ozet{display:flex;justify-content:space-between;align-items:center;gap:16px}
.ozet h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;line-height:1.25}
.ozet p{margin:0;font-size:14px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:14px;color:var(--soft);display:flex;align-items:center;gap:6px}
.stats i{display:inline-block;width:8px;height:8px;border-radius:50%}
.chev-lg{font-size:28px;color:var(--soft);line-height:1}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="./">Hisse Takip</a>
  <nav class="seg" aria-label="Bölümler"><a href="./" aria-current="page">Ana sayfa</a><a href="altin.html">Altın</a><a href="hisseler.html">Hisse Senetleri</a></nav>
</div></header>

<main class="wrap page">
  <p class="eyebrow" id="tarih"></p>
  <h1>Piyasa özeti</h1>

  <div class="sec-h"><h2>Altın</h2><a href="altin.html">Grafikler ›</a></div>
  <div class="kpis" id="kpis"></div>
  <p class="note" id="zaman"></p>

  <div class="sec-h"><h2><a href="hisseler.html">Hisse Senetleri ›</a></h2></div>
  <a class="card card-link" href="hisseler.html" aria-label="Hisse senetleri sayfasını aç">
    <div class="ozet"><div><h3 id="h-baslik">Temel analiz yükleniyor…</h3><p id="h-zaman"></p></div><span class="chev-lg" aria-hidden="true">›</span></div>
    <div class="stats" id="h-stats"></div>
  </a>
</main>

<footer><div class="wrap"><div>Altın: Altınkaynak. Hisseler: İş Yatırım mali tablolar ve oranlar. Kuralların mekanik uygulamasıdır; yatırım tavsiyesi değildir.</div></div></footer>

<script src="ortak.js"></script>
<script>
{
const { tr, TURLER, altinYukle, kpi, zaman } = HT;
document.getElementById("tarih").textContent = new Date().toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
const ciz = () => {
  document.getElementById("kpis").innerHTML = TURLER.map(([k, ad]) => kpi(k, ad, { link: "altin.html#" + k })).join("");
  document.getElementById("zaman").textContent = zaman();
};
altinYukle(ciz);
fetch("data/sonuc.json", { cache: "no-store" }).then(r => r.json()).then(D => {
  const S = D.sonuclar, n = k => S.filter(r => r.karar === k).length, d = new Date(D.meta.asOf);
  document.getElementById("h-baslik").textContent = `${S.length} hisseden ${n("ALIM ADAYI")} tanesi dört maddeyi de geçiyor`;
  document.getElementById("h-zaman").textContent = `Son analiz ${d.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} ${d.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })}`;
  document.getElementById("h-stats").innerHTML = [["ALIM ADAYI", "Alım adayı", "var(--green)"], ["KOŞULLU", "Koşullu", "var(--soft)"], ["İZLEME (BSA FIRSATI)", "İzleme", "var(--orange)"]]
    .map(([k, ad, c]) => `<div><b>${n(k)}</b><span><i style="background:${c}"></i>${ad}</span></div>`).join("");
}).catch(() => { document.getElementById("h-baslik").textContent = "Hisse verisi okunamadı"; });
}
</script>
</body>
</html>
