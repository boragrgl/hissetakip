<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altın · Hisse Takip</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
/* Altın ayrıntı: başlık + büyük fiyat, yanında Alış/Satış/Yüksek/Düşük kutuları, gün içi aralık çubuğu, 1 aylık grafik */
.ust{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ust .seg{background:var(--fill)}
.ust h1{font-size:clamp(26px,3vw,32px);margin:0}
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kutu .pct{font-size:14px;font-weight:600;margin-left:8px}
.kutu{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.kutu>span{display:block;font-size:13px;color:var(--soft)}
.kutu b{display:block;font-size:clamp(18px,2vw,22px);font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.aralik{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:26px;font-size:14px;font-weight:600}
.aralik .d{color:var(--red)}.aralik .y{color:var(--green)}
.cubuk{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--line) 50%,var(--green))}
.cubuk i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--card);border:4px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.chart-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.chart-h h2{font-size:20px}
.chart-h .chg{font-size:15px;font-weight:500}
.fig{position:relative;height:340px;margin-top:12px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{font:12px -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;fill:var(--soft)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--soft);margin-top:8px}
.key i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.tip b{font-weight:600}
@media(max-width:860px){.hero{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.fig{height:260px}.kutu{padding:12px 14px;border-radius:14px}.ust .seg{width:100%}.ust .seg button{flex:1;padding:7px 4px;font-size:13px}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="./">Hisse Takip</a>
  <nav class="seg" aria-label="Bölümler"><a href="./">Ana sayfa</a><a href="altin.html" aria-current="page">Altın</a><a href="hisseler.html">Hisse Senetleri</a></nav>
</div></header>

<main class="wrap page">
  <div class="ust">
    <h1 id="baslik">Altın</h1>
    <div class="seg" role="group" aria-label="Altın türü" id="turler"></div>
  </div>

  <div class="hero">
    <div class="kutu"><span>Alış</span><b id="k-alis">—</b></div>
    <div class="kutu"><span>Satış</span><b><span id="k-satis">—</span><span class="pct" id="yuzde"></span></b></div>
    <div class="kutu"><span>Yüksek</span><b id="k-yuksek">—</b></div>
    <div class="kutu"><span>Düşük</span><b id="k-dusuk">—</b></div>
  </div>
  <div class="aralik"><span class="d">Düşük</span><div class="cubuk"><i id="imlec" style="left:50%"></i></div><span class="y">Yüksek</span></div>
  <p class="note" id="guncel"></p>

  <section class="card" style="margin-top:22px" aria-labelledby="g-h">
    <div class="chart-h"><h2 id="g-h">Son 1 ay</h2><span class="chg" id="g-chg"></span></div>
    <div class="fig" id="fig"><svg id="chart" role="img" aria-label="Seçili altın türünün son 1 aylık fiyat grafiği"></svg><div class="tip" id="tip"></div></div>
    <div class="key" id="key"></div>
    <p class="note" id="g-not"></p>
  </section>
</main>

<footer><div class="wrap"><div>Altın: Altınkaynak (canlı ve saatlik kayıt); 22 Kasım öncesi günlük kapanışlar yüklenen dosyadan. Yatırım tavsiyesi değildir.</div></div></footer>

<script src="ortak.js"></script>
<script>
{
const { tr, TURLER, tur, para, altinYukle, seri, son, degisim, gunAraligi } = HT;
const GUN = 30;
let sec = TURLER.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "C", pts = [];
const svg = document.getElementById("chart"), tip = document.getElementById("tip"), $ = id => document.getElementById(id);

function ust() {
  $("turler").innerHTML = TURLER.map(([k, ad]) => `<button data-k="${k}" aria-pressed="${k === sec}">${ad.replace(" altın", "").replace("22 ayar hurda", "Hurda")}</button>`).join("");
  const [, ad] = tur(sec), p = son(sec), d = degisim(sec), ar = gunAraligi(sec);
  document.title = `${ad} · Hisse Takip`;
  $("baslik").textContent = ad.charAt(0).toUpperCase() + ad.slice(1);
  $("yuzde").innerHTML = d == null ? "" : `<span class="${d >= 0 ? "up" : "down"}">${d < 0 ? "-" : ""}%${tr(Math.abs(d) * 100, 2)}</span>`;
  $("k-alis").textContent = p ? para(sec, p.a) : "—";
  $("k-satis").textContent = p ? para(sec, p.s) : "—";
  $("k-yuksek").textContent = ar ? para(sec, ar.yuksek) : "—";
  $("k-dusuk").textContent = ar ? para(sec, ar.dusuk) : "—";
  const konum = ar && p && ar.yuksek > ar.dusuk ? (p.s - ar.dusuk) / (ar.yuksek - ar.dusuk) * 100 : 50;
  $("imlec").style.left = Math.max(0, Math.min(100, konum)) + "%";
  $("guncel").textContent = p && p.t ? `Güncelleme ${p.t.toLocaleString("tr-TR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })} · Gösterge fiyattır, işlem fiyatı değildir.${ar ? ` Yüksek/düşük ${ar.gun.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} günü ${ar.n} kayda göre (satış).` : ""}` : "Fiyat alınamadı.";
}
function grafik() {
  const W = svg.clientWidth, H = svg.clientHeight; if (!W || !H) return;
  const s = seri(sec, GUN), not = $("g-not"), key = $("key");
  if (s.length < 2) { svg.innerHTML = ""; pts = []; $("g-chg").textContent = ""; key.innerHTML = ""; not.textContent = "Bu tür için grafik verisi henüz birikiyor; saat başı kayıt ekleniyor."; return; }
  const ilk = s[0], sn = s[s.length - 1], fark = sn.s / ilk.s - 1;
  $("g-chg").innerHTML = `<span class="${fark >= 0 ? "up" : "down"}">${fark >= 0 ? "+" : "−"}${para(sec, Math.abs(sn.s - ilk.s))} (${fark >= 0 ? "+" : "−"}%${tr(Math.abs(fark) * 100, 2)})</span>`;
  const tahmin = s.some(p => p.tahmini), gercekIlk = s.find(p => !p.tahmini), dosyaVar = s.some(p => p.kaynak === "dosya");
  const KAYNAK = { dosya: "Günlük kapanış (yüklenen dosya)", evds: "Tahmini (TCMB EVDS)" };
  const gecmisAd = [...new Set(s.filter(p => p.tahmini).map(p => KAYNAK[p.kaynak] || p.kaynak))].join(", ");
  key.innerHTML = `<span><i style="border-color:var(--gold)"></i>Satış (Altınkaynak)</span>${tahmin ? `<span><i style="border-color:var(--gold);border-top-style:dashed"></i>${gecmisAd}</span>` : ""}<span><i style="border-color:var(--soft)"></i>Alış (Altınkaynak)</span>`;
  not.textContent = tahmin && gercekIlk ? `${gercekIlk.t.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} öncesi kesikli kısım ${dosyaVar ? `yüklenen dosyadaki günlük ${sec === "B_T" ? "gösterge fiyatlarıdır (bozdurma fiyatı değildir)" : "kapanış fiyatlarıdır"}` : "TCMB EVDS altın serisinin Altınkaynak fiyatına ölçeklenmiş tahminidir"}; Altınkaynak fiyatı değildir.` : "";

  const L = W < 420 ? 52 : 66, R = 14, T = 12, B = 28, dd = tur(sec)[3];
  const vals = s.flatMap(p => [p.a, p.s]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || hi * 0.01; lo -= pad; hi += pad;
  const t0 = Math.min(ilk.t.getTime(), Date.now() - GUN * 864e5), t1 = Math.max(sn.t.getTime(), Date.now());
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const r = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(r)), m = r / p10, step = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p10;
  let g = `<defs><linearGradient id="alan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".16"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { const yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${tr(v, step < 1 ? dd : 0)}</text>`; }
  const nt = W < 420 ? 3 : 5;
  for (let i = 0; i <= nt; i++) { const t = t0 + (t1 - t0) * i / nt; g += `<text x="${x(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nt ? "end" : "middle"}">${new Date(t).toLocaleDateString("tr-TR", { day: "numeric", month: "short" })}</text>`; }
  const yol = (arr, k) => arr.filter(p => p[k] != null).map((p, i) => `${i ? "L" : "M"}${x(p.t.getTime()).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  const iT = s.findIndex(p => !p.tahmini), tah = iT < 0 ? s : s.slice(0, iT + 1), ger = iT < 0 ? [] : s.slice(iT);
  const alan = `${yol(s, "s")}L${x(sn.t.getTime()).toFixed(1)},${H - B}L${x(ilk.t.getTime()).toFixed(1)},${H - B}Z`;
  g += `<path d="${alan}" fill="url(#alan)"/>
    <path d="${yol(s, "a")}" fill="none" stroke="var(--soft)" stroke-width="1.5" opacity=".7"/>
    ${tah.length > 1 && iT !== 0 ? `<path d="${yol(tah, "s")}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>` : ""}
    ${ger.length > 1 ? `<path d="${yol(ger, "s")}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    <circle cx="${x(sn.t.getTime())}" cy="${y(sn.s)}" r="4" fill="var(--gold)" stroke="var(--card)" stroke-width="2"/>
    <line id="cursor" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--soft)" stroke-dasharray="2 3" visibility="hidden"/>`;
  svg.innerHTML = g;
  pts = s.map(p => ({ x: x(p.t.getTime()), y: y(p.s), p }));
}
function imlec(e) {
  if (!pts.length) return;
  const b = svg.getBoundingClientRect(), cx = e.clientX - b.left;
  let best = pts[0]; for (const q of pts) if (Math.abs(q.x - cx) < Math.abs(best.x - cx)) best = q;
  const c = svg.querySelector("#cursor"); c.setAttribute("x1", best.x); c.setAttribute("x2", best.x); c.setAttribute("visibility", "visible");
  tip.style.display = "block"; tip.style.left = Math.min(Math.max(best.x, 70), b.width - 70) + "px"; tip.style.top = best.y + "px";
  const kd = { dosya: "günlük kapanış", evds: "tahmini", altinkaynak: "Altınkaynak" }[best.p.kaynak] || best.p.kaynak;
  const zt = best.p.kaynak === "dosya" ? best.p.t.toLocaleDateString("tr-TR", { day: "numeric", month: "short" }) : best.p.t.toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  tip.innerHTML = `<b>${para(sec, best.p.s)}</b>${best.p.a != null ? ` · alış ${para(sec, best.p.a)}` : ""}<br><span style="color:var(--soft)">${zt} · ${kd}</span>`;
}
function gizle() { tip.style.display = "none"; const c = svg.querySelector("#cursor"); if (c) c.setAttribute("visibility", "hidden"); }
svg.addEventListener("pointermove", imlec); svg.addEventListener("pointerleave", gizle);
$("turler").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sec = b.dataset.k; history.replaceState(null, "", "#" + sec); ust(); grafik(); });
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TURLER.some(t => t[0] === h)) { sec = h; ust(); grafik(); } });
const ro = new ResizeObserver(grafik); ro.observe(svg);
altinYukle(() => { ust(); grafik(); });
}
</script>
</body>
</html>
