<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altın · Hisse Takip</title>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stil.css">
<style>
/* Altın sayfası: KPI seçimi + seçili türün grafiği */
.chart-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chart-h .ad{font-size:15px;color:var(--soft);margin:0}
.chart-h .deger{font-size:34px;font-weight:600;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums}
.chart-h .chg{font-size:15px;font-weight:500}
.fig{position:relative;height:340px;margin-top:12px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig svg text{font:12px -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;fill:var(--soft)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--soft);margin-top:8px}
.key i{display:inline-block;width:16px;height:0;border-top:2.5px solid;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.tip b{font-weight:600}
@media(max-width:640px){.fig{height:260px}.chart-h .deger{font-size:28px}}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="./">Hisse Takip</a>
  <nav class="seg" aria-label="Bölümler"><a href="./">Ana sayfa</a><a href="altin.html" aria-current="page">Altın</a><a href="hisseler.html">Hisse Senetleri</a></nav>
</div></header>

<main class="wrap page">
  <h1>Altın</h1>
  <p class="lead" id="zaman">Fiyatlar yükleniyor…</p>

  <div class="kpis" id="kpis" style="margin-top:22px"></div>

  <section class="card" style="margin-top:16px" aria-labelledby="g-ad">
    <div class="chart-h">
      <div><p class="ad" id="g-ad">Gram altın · satış</p><div class="deger" id="g-deger">—</div><div class="chg" id="g-chg"></div></div>
      <div class="seg" role="group" aria-label="Dönem"><button aria-pressed="true" data-gun="30">1 Ay</button></div>
    </div>
    <div class="fig" id="fig"><svg id="chart" role="img" aria-label="Seçili altın türünün fiyat grafiği"></svg><div class="tip" id="tip"></div></div>
    <div class="key" id="key"></div>
    <p class="note" id="g-not"></p>
  </section>
  <p class="note">Canlı fiyatlar Altınkaynak'ın herkese açık altın servisinden gelir ve saat başı kaydedilir.</p>
</main>

<footer><div class="wrap"><div>Altın: Altınkaynak; geçmiş tahmini kısım TCMB EVDS. Yatırım tavsiyesi değildir.</div></div></footer>

<script src="ortak.js"></script>
<script>
{
const { tr, pc, TURLER, altinYukle, kpi, zaman, seri } = HT;
let sec = TURLER.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "GA", GUN = 30, pts = [];
const svg = document.getElementById("chart"), tip = document.getElementById("tip");

function kpilar() {
  document.getElementById("kpis").innerHTML = TURLER.map(([k, ad]) => kpi(k, ad, { secili: k === sec })).join("");
  document.getElementById("zaman").textContent = zaman() || "Fiyat alınamadı";
}
function grafik() {
  const W = svg.clientWidth, H = svg.clientHeight; if (!W || !H) return;
  const ad = TURLER.find(t => t[0] === sec)[1], s = seri(sec, GUN);
  document.getElementById("g-ad").textContent = `${ad} · satış`;
  const not = document.getElementById("g-not"), key = document.getElementById("key");
  if (!s.length) { svg.innerHTML = ""; document.getElementById("g-deger").textContent = "—"; not.textContent = "Henüz kayıt yok."; key.innerHTML = ""; return; }
  const ilk = s[0], son = s[s.length - 1], fark = son.s / ilk.s - 1;
  document.getElementById("g-deger").textContent = tr(son.s) + " ₺";
  document.getElementById("g-chg").innerHTML = s.length > 1 ? `<span class="${fark >= 0 ? "up" : "down"}">${fark >= 0 ? "+" : "−"}${tr(Math.abs(son.s - ilk.s))} ₺ (${fark >= 0 ? "+" : "−"}${tr(Math.abs(fark) * 100, 2)}%)</span> <span style="color:var(--soft)">son ${GUN} gün</span>` : "";
  const tahmin = s.some(p => p.tahmini), gercekIlk = s.find(p => !p.tahmini);
  key.innerHTML = `<span><i style="border-color:var(--gold)"></i>Satış (Altınkaynak)</span>${tahmin ? `<span><i style="border-color:var(--gold);border-top-style:dashed"></i>Tahmini (TCMB EVDS'den)</span>` : ""}<span><i style="border-color:var(--soft)"></i>Alış</span>`;
  const kapsam = (son.t - ilk.t) / 864e5;
  not.textContent = tahmin && gercekIlk ? `${gercekIlk.t.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} öncesi kesikli kısım, TCMB EVDS altın serisinin Altınkaynak fiyatına ölçeklenmiş tahminidir.` : (kapsam < GUN - 4 ? `Kayıtlar ${ilk.t.toLocaleDateString("tr-TR", { day: "numeric", month: "long" })} tarihinden başlıyor; 1 aylık görünüm kayıtlar biriktikçe dolacak.` : "");

  const L = W < 420 ? 48 : 62, R = 14, T = 12, B = 28;
  const vals = s.flatMap(p => [p.a, p.s]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.1 || hi * 0.01; lo -= pad; hi += pad;
  const t0 = Math.min(ilk.t.getTime(), Date.now() - GUN * 864e5), t1 = Math.max(son.t.getTime(), Date.now());
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const r = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(r)), m = r / p10, step = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p10;
  let g = `<defs><linearGradient id="alan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".16"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) { const yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${tr(v)}</text>`; }
  const nt = W < 420 ? 3 : 5;
  for (let i = 0; i <= nt; i++) { const t = t0 + (t1 - t0) * i / nt; g += `<text x="${x(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nt ? "end" : "middle"}">${new Date(t).toLocaleDateString("tr-TR", { day: "numeric", month: "short" })}</text>`; }
  const yol = (arr, k) => arr.filter(p => p[k] != null).map((p, i) => `${i ? "L" : "M"}${x(p.t.getTime()).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  // Tahmini (EVDS) kısım kesikli, gerçek kısım düz; iki parça birleşim noktasında birleşir
  const iT = s.findIndex(p => !p.tahmini), tah = iT < 0 ? s : s.slice(0, iT + 1), ger = iT < 0 ? [] : s.slice(iT);
  const alan = s.length > 1 ? `${yol(s, "s")}L${x(son.t.getTime()).toFixed(1)},${H - B}L${x(ilk.t.getTime()).toFixed(1)},${H - B}Z` : "";
  g += `${alan ? `<path d="${alan}" fill="url(#alan)"/>` : ""}
    <path d="${yol(s, "a")}" fill="none" stroke="var(--soft)" stroke-width="1.5" opacity=".7"/>
    ${tah.length > 1 && iT !== 0 ? `<path d="${yol(tah, "s")}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/>` : ""}
    ${ger.length > 1 ? `<path d="${yol(ger, "s")}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ""}
    ${s.length < 3 ? s.map(p => `<circle cx="${x(p.t.getTime())}" cy="${y(p.s)}" r="4" fill="var(--gold)"/>`).join("") : `<circle cx="${x(son.t.getTime())}" cy="${y(son.s)}" r="4" fill="var(--gold)" stroke="var(--card)" stroke-width="2"/>`}
    <line id="cursor" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--soft)" stroke-dasharray="2 3" visibility="hidden"/>`;
  svg.innerHTML = g;
  pts = s.map(p => ({ x: x(p.t.getTime()), y: y(p.s), p }));
}
function imlec(e) {
  if (!pts.length) return;
  const b = svg.getBoundingClientRect(), cx = (e.touches ? e.touches[0].clientX : e.clientX) - b.left;
  let best = pts[0]; for (const q of pts) if (Math.abs(q.x - cx) < Math.abs(best.x - cx)) best = q;
  const c = svg.querySelector("#cursor"); c.setAttribute("x1", best.x); c.setAttribute("x2", best.x); c.setAttribute("visibility", "visible");
  tip.style.display = "block"; tip.style.left = Math.min(Math.max(best.x, 70), b.width - 70) + "px"; tip.style.top = best.y + "px";
  tip.innerHTML = `<b>${tr(best.p.s)} ₺</b> · alış ${tr(best.p.a)} ₺<br><span style="color:var(--soft)">${best.p.t.toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}${best.p.tahmini ? " · tahmini" : ""}</span>`;
}
function gizle() { tip.style.display = "none"; const c = svg.querySelector("#cursor"); if (c) c.setAttribute("visibility", "hidden"); }
svg.addEventListener("pointermove", imlec); svg.addEventListener("pointerleave", gizle);
document.getElementById("kpis").addEventListener("click", e => { const b = e.target.closest(".kpi"); if (!b) return; sec = b.dataset.k; history.replaceState(null, "", "#" + sec); kpilar(); grafik(); });
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TURLER.some(t => t[0] === h)) { sec = h; kpilar(); grafik(); } });
const ro = new ResizeObserver(grafik); ro.observe(svg);
altinYukle(() => { kpilar(); grafik(); });
}
</script>
</body>
</html>
